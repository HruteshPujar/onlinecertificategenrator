<div class="sidebar">
    <div class="logo">
        <h2>🎓 OCMS</h2>
        <p>Online Certificate System</p>
    </div>

    <ul>
        <li>
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="{% url 'event_list' %}" class="{% if request.resolver_match.url_name in 'event_list,add_event,edit_event' %}active{% endif %}">
                <i class="bi bi-calendar-event"></i>
                Events
            </a>
        </li>

        <li>
            <a href="{% url 'participant_list' %}" class="{% if request.resolver_match.url_name in 'participant_list,add_participant,edit_participant,preview_certificate' %}active{% endif %}">
                <i class="bi bi-people-fill"></i>
                Participants
            </a>
        </li>

        <li>
            <a href="{% url 'certificate_list' %}" class="{% if request.resolver_match.url_name == 'certificate_list' %}active{% endif %}">
                <i class="bi bi-award-fill"></i>
                Certificates
            </a>
        </li>

        <li>
            <a href="{% url 'import_participants' %}" class="{% if request.resolver_match.url_name == 'import_participants' %}active{% endif %}">
                <i class="bi bi-upload"></i>
                Import Excel / CSV
            </a>
        </li>

        <li>
            <a href="{% url 'reports_dashboard' %}" class="{% if request.resolver_match.url_name in 'reports_dashboard,export_participants_csv' %}active{% endif %}">
                <i class="bi bi-bar-chart-fill"></i>
                Reports & Analytics
            </a>
        </li>

        <li>
            <a href="{% url 'logout' %}" class="logout">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>
        </li>
    </ul>
</div>
