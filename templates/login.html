{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - OCMS Certificate Studio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- OCMS Design System -->
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/buttons.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #EEF2FF 0%, #F8FAFC 50%, #E0E7FF 100%);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Background Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }
        .orb-1 {
            width: 450px;
            height: 450px;
            background: rgba(79, 70, 229, 0.25);
            top: -100px;
            right: -100px;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(14, 165, 233, 0.2);
            bottom: -80px;
            left: -80px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 40px -15px rgba(30, 41, 59, 0.12);
            padding: 40px 36px;
        }

        .auth-logo-badge {
            width: 56px;
            height: 56px;
            background: var(--primary-gradient);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            margin: 0 auto 16px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 16px;
        }

        .input-icon-wrap .form-control {
            padding-left: 42px;
            height: 46px;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color-light);
            font-size: 12px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <!-- Ambient glowing backdrops -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="auth-container animate-fade-up">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo-badge">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <h1 class="auth-title">Welcome to OCMS</h1>
                <p class="auth-subtitle">Sign in to access your certificate generator portal</p>
            </div>

            {% if error %}
            <div class="alert alert-danger d-flex align-items-center gap-2 mb-4 py-2 px-3 small" role="alert">
                <i class="bi bi-exclamation-circle-fill fs-5"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person"></i>
                        <input 
                            type="text" 
                            id="username"
                            name="username" 
                            class="form-control" 
                            placeholder="Enter your username" 
                            required 
                            autofocus
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0" for="password">Password</label>
                    </div>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock"></i>
                        <input 
                            type="password" 
                            id="password"
                            name="password" 
                            class="form-control" 
                            placeholder="••••••••" 
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fs-6">
                    <span>Sign In to Dashboard</span>
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="auth-footer">
                <i class="bi bi-shield-lock-fill text-primary me-1"></i>
                Online Certificate Management System &copy; 2026
            </div>
        </div>
    </div>
</body>
</html>
